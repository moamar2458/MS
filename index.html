<meta name="viewport" content="width=device-width, initial-scale=1">
<title>מלאכת סופר</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Assistant:wght@400;600;700&family=Frank+Ruhl+Libre:wght@500;700&display=swap" rel="stylesheet">
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Copied from the Money Tracker: light grey page, Arial, big round mics, blue pills, white boxes with a blue border,
   green box for money in, red for job spending, yellow percent box, orange summary bar, purple history bar.
   One light look on purpose, the same as the Money Tracker. */
:root { --page: #f4f4f8; color-scheme: light; }
* { box-sizing: border-box; }
html, body { margin: 0; max-width: 100vw; }
body { font-family: Arial, sans-serif; background: var(--page); color: #000; overflow-x: hidden; width: 100%;
  padding-block: 8px 16px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
button, input { font-family: inherit; }
:focus-visible { outline: 3px solid #4a6cf7; outline-offset: 2px; }
h1 { text-align: center; font-size: 20px; margin: 2px 0 8px 0; }
.income { color: green; }
.job { color: #d97706; }
.personal { color: crimson; }
.langBtn { position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); left: max(8px, env(safe-area-inset-left, 0px)); padding: 3px 8px; font-size: 16px; border: none; border-radius: 8px; background: #333; color: white; cursor: pointer; z-index: 10; }
#toFront { display: none; position: fixed; top: calc(8px + env(safe-area-inset-top, 0px)); right: max(8px, env(safe-area-inset-right, 0px)); padding: 2px 26px; font-size: 24px; font-weight: bold; line-height: 1.2; border: none; border-radius: 10px; background: crimson; color: white; cursor: pointer; z-index: 10; }
.rowLabel { font-size: 18px; font-weight: bold; color: #333; margin-bottom: -12px; }
.homeMic.half { width: 150px; height: 24px; border-radius: 12px; font-size: 13px; margin: 6px 0 2px; }
.pageWrap { width: 100%; max-width: 620px; margin: 0 auto; padding-top: 34px; }

/* ===== Start page ===== */
#startPage { display: none; gap: 22px; justify-content: center; align-items: center; flex-direction: column; min-height: 80vh; direction: ltr; }
.startMic { width: min(200px, 42vw); height: min(200px, 42vw); border-radius: 50%; border: none; color: white; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 0; }
.startMic .micIcon { font-size: min(52px, 11vw); line-height: 1; }
.startMic .micLabel { font-size: min(28px, 6.5vw); font-weight: bold; }
.startRow { display: flex; gap: min(40px, 6vw); justify-content: center; }
.startMic.purple { background: #7a3db8; width: min(133px, 28vw); height: min(133px, 28vw); gap: 4px; }
.startMic.purple .micIcon { font-size: min(35px, 7.5vw); }
.startMic.purple .micLabel { font-size: min(19px, 4.5vw); }
.startMic.red { background: #d32f2f; }
.startMic.green { background: #2e9e44; }
.startMic.listening { box-shadow: 0 0 0 14px rgba(224,69,123,0.45); }
.enterBtn { width: 270px; max-width: 80vw; padding: 12px 20px; font-size: 22px; font-weight: bold; border: none; border-radius: 26px; background: #4a6cf7; color: white; cursor: pointer; }
.personalBtn { width: 180px; max-width: 54vw; margin-top: -10px; padding: 9px 12px; font-size: 18px; font-weight: bold; border: none; border-radius: 22px; background: #2a6df4; color: white; cursor: pointer; }
.homeMicMsg { font-size: 15px; color: #333; min-height: 20px; text-align: center; }
#startMsgLine { max-width: 90vw; direction: rtl; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: center; }
.undoBtn { padding: 3px 12px; font-size: 14px; border: none; border-radius: 6px; background: #666; color: white; cursor: pointer; }

/* ===== Money management page with the small boxes ===== */
#homePage { display: none; }
.homeMicRow { display: flex; flex-direction: column; align-items: center; gap: 4px; margin-bottom: 4px; }
.homeMic { width: 300px; max-width: 100%; height: 44px; border-radius: 22px; border: none; background: #4a6cf7; color: white; font-size: 22px; cursor: pointer; }
.groupTitle { margin: 8px 0 0 0; font-size: 16px; font-weight: bold; text-align: right; }
.groupTitle.cust { color: green; }
.groupTitle.supp { color: crimson; }
.home { display: grid; grid-template-columns: repeat(2, 150px); gap: 16px; justify-content: center; padding: 10px 0; }
.tile { position: relative; width: 150px; height: 140px; border-radius: 16px; background: white; border: 3px solid #4a6cf7; cursor: pointer; text-align: center; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; padding: 8px; }
.tile:hover { background: #eef2ff; }
.tile .name { font-size: 17px; font-weight: bold; overflow-wrap: anywhere; line-height: 1.2; padding: 0 18px; }
.tile .num { font-size: 22px; font-weight: bold; color: #d97706; }
.tile .opened { font-size: 14px; color: #888; white-space: normal; overflow-wrap: anywhere; line-height: 1.3; max-width: 100%; }
.tile .rename { position: absolute; top: 6px; inset-inline-end: 6px; padding: 2px 7px; font-size: 15px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; }
.tile .removeTile { position: absolute; top: 6px; inset-inline-start: 6px; padding: 2px 7px; font-size: 15px; border: none; border-radius: 6px; background: #999; color: white; cursor: pointer; }
.tile.flash { animation: flash 1.4s ease-out; }
@keyframes flash { from { box-shadow: 0 0 0 6px #f5b800; } to { box-shadow: 0 0 0 0 transparent; } }
.emptyGroup { font-size: 15px; color: #666; text-align: center; grid-column: 1 / -1; }
/* While a bar is open, the small boxes shrink into one row */
body.compactBoxes .home { display: flex; flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; gap: 8px; padding: 4px 0; }
body.compactBoxes .tile { flex: 0 0 110px; width: 110px; height: 68px; border-width: 2px; border-radius: 12px; gap: 0; padding: 4px; }
body.compactBoxes .tile .name { font-size: 14px; margin-top: 8px; padding: 0 12px; }
body.compactBoxes .tile .num { font-size: 15px; }
body.compactBoxes .tile .opened { display: none; }
body.compactBoxes .tile .rename, body.compactBoxes .tile .removeTile { padding: 0 5px; font-size: 12px; top: 3px; }
body.compactBoxes .groupTitle { margin-top: 4px; font-size: 14px; }

.sideTitle { margin: 0 0 4px 0; font-size: 16px; text-align: right; }
.summaryBox { background: white; border-radius: 12px; padding: 10px; margin: 8px 0; display: flex; flex-direction: column; }
#jobSummary, #suppSummary { border: 2px solid #d97706; }
.jobColor { color: #d97706; }
.summaryBox .sideTitle { text-align: center; margin: 0 0 6px 0; }
.viewTabs { display: flex; gap: 6px; justify-content: center; margin-bottom: 6px; flex-wrap: wrap; }
.viewTab { padding: 4px 14px; font-size: 15px; border: 1px solid #999; border-radius: 14px; background: #f1f1f1; cursor: pointer; }
.viewTab.active { background: #333; color: white; border-color: #333; }
.viewTab.active.paidTab { background: green; border-color: green; }
.viewTab.active.owesTab { background: crimson; border-color: crimson; }
.summaryList { max-height: 52vh; overflow-y: auto; overflow-x: auto; }
.periodRow { display: grid; grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr; gap: 4px; font-size: 14px; padding: 4px 6px; border-bottom: 1px solid #eee; align-items: center; text-align: center; min-width: 340px; }
.periodRow.head { font-weight: bold; color: #555; font-size: 12px; position: sticky; top: 0; background: white; }
.periodRow .period { text-align: start; font-weight: bold; overflow-wrap: anywhere; }
.periodTitle { background: #333; color: white; border-radius: 6px; padding: 3px 8px; margin: 8px 0 2px 0; font-size: 14px; font-weight: bold; text-align: start; min-width: 340px; }
.periodRow.totalRow { background: #fff3cf; font-weight: bold; border-bottom: 2px solid #d9a400; }
.foldTitle { display: flex; justify-content: space-between; align-items: center; cursor: pointer; user-select: none; gap: 8px; }
.foldTitle .foldSum { font-weight: normal; opacity: 0.85; direction: ltr; }
.clickRow { cursor: pointer; }
.clickRow:hover { background: #fff3e0; }
.clickRow .period { color: #b45f06; }
.periodDetail { background: #fff8ef; border-bottom: 1px solid #eee; padding: 4px 10px 6px 10px; font-size: 14px; min-width: 340px; }
.detailLine { display: grid; grid-template-columns: auto 1fr auto; gap: 10px; padding: 2px 0; align-items: center; }
.detailLine > div:first-child { color: #888; font-size: 13px; }
.detailAmount { font-weight: bold; direction: ltr; }
.detailTotal { border-top: 1px solid #f0c9a0; margin-top: 3px; padding-top: 4px; font-weight: bold; }
.savedTitle { font-size: 15px; color: #666; }
#historyBox { margin: 4px 0 8px 0; background: white; border: 2px solid #7a3db8; border-radius: 12px; padding: 10px; display: flex; flex-direction: column; }
.historyTitle { color: #7a3db8; text-align: center; margin: 0 0 6px 0; }
#historyList { max-height: 60vh; overflow-y: auto; }
.histRow { display: grid; grid-template-columns: auto 1.4fr 1fr 1fr 1fr auto; gap: 6px; align-items: center; font-size: 15px; padding: 5px 6px; border-bottom: 1px solid #eee; text-align: center; cursor: pointer; }
.histRow:hover { background: #f5eefc; }
.histRow.checked { background: #c8f0c8; }
.histRow input[type=checkbox] { width: 20px; height: 20px; cursor: pointer; }
.histRow.head { font-weight: bold; color: #555; font-size: 13px; cursor: default; background: white; }
.histRow .histName { text-align: start; font-weight: bold; overflow-wrap: anywhere; }
.histRow .histDates { font-size: 13px; color: #777; grid-column: 1 / -1; text-align: start; }
.histRow button { padding: 3px 8px; font-size: 13px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; }
.panelTitle { cursor: pointer; user-select: none; }
.panelTitle::after { content: ' \25B4'; }
.panel.closed .panelTitle::after { content: ' \25BE'; }
.panel.closed .viewTabs, .panel.closed .summaryList, .panel.closed #historyList { display: none; }
#jobSummary.closed, #historyBox.closed, #suppSummary.closed { padding: 6px 10px; }
.panel.closed .panelTitle { margin: 0; }
#fileBar { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 4px 0 8px 0; }
#bm { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
#bm[hidden] { display: none; }
.itemsRow { display: flex; gap: 8px; align-items: center; }
.itemsMic { padding: 6px 12px; font-size: 18px; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; }
.itemsMic.listening { background: #e0457b; }
#chooseList button { width: 100%; padding: 10px; font-size: 17px; border: 1px solid #4a6cf7; border-radius: 8px; background: #f4f6ff; cursor: pointer; text-align: center; }
#chooseList button.strong { background: #2a6df4; color: white; border-color: #2a6df4; font-weight: bold; }
#chooseList button.cancel { background: #666; color: white; border-color: #666; }
.fileBtn { padding: 8px 14px; font-size: 15px; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; }
.fileBtn.load { background: #666; }
.fileBtn.excel { background: #1d6f42; }
.fileMsg { font-size: 15px; color: #333; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.sendLink { padding: 6px 12px; border-radius: 8px; color: white; text-decoration: none; font-size: 15px; font-weight: bold; }
.sendLink.wa { background: #25a244; }
.sendLink.mail { background: #4a6cf7; }

/* ===== One card, full page ===== */
#app { display: none; flex-direction: column; width: 100%; max-width: 620px; margin: 0 auto; padding-top: 34px; }
.titleEdit { padding: 2px 8px; font-size: 16px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; vertical-align: middle; }
.openedLine { text-align: center; font-size: 14px; color: #888; margin: -4px 0 6px 0; }
.shrinkBtn { align-self: center; margin-bottom: 6px; padding: 6px 14px; font-size: 16px; border: none; border-radius: 8px; background: #666; color: white; cursor: pointer; }
.top { display: flex; flex-direction: column; align-items: center; gap: 8px; }
button.bigMic { width: 64px; height: 64px; border-radius: 32px; border: none; background: #4a6cf7; color: white; font-size: 28px; cursor: pointer; flex-shrink: 0; }
button.bigMic.listening { background: #e0457b; }
.typeArea { width: 100%; min-width: 0; }
.typeRow { display: flex; gap: 6px; justify-content: center; }
.typeRow input { flex: 0 1 225px; width: 225px; min-width: 0; padding: 8px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
.typeRow button { padding: 6px 12px; font-size: 20px; border: none; border-radius: 8px; color: white; cursor: pointer; }
.typeRow button.arrowJob { background: crimson; }
.arrowKey { font-size: 13px; color: #666; margin-top: 3px; text-align: center; }
.heard { color: #333; min-height: 18px; margin: 6px 0; font-size: 15px; text-align: center; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; align-items: center; }
.col { border-radius: 12px; padding: 8px; margin-bottom: 8px; }
.col.in { background: #e5f4e4; border: 2px solid green; }
.col h2 { margin: 0 0 6px 0; font-size: 15px; text-align: center; }
.cards { display: flex; gap: 8px; margin-bottom: 8px; }
.card { flex: 1 1 0; min-width: 0; background: white; border-radius: 8px; padding: 8px; text-align: center; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.card h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
.card .total, .card .amount { font-size: 22px; font-weight: bold; }
.jobCard { background: #fbebeb; border: 2px solid crimson; }
.tenBar { background: #fff8e1; border: 2px solid #f5b800; padding: 6px 8px; border-radius: 8px; text-align: center; }
.tenBar h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
.tenBar .amount { font-size: 20px; font-weight: bold; color: #b38600; }
.tenBar input { width: 52px; padding: 2px 4px; font-size: 15px; border: 1px solid #b38600; border-radius: 6px; text-align: center; }
.card.moneyInCard { position: relative; }
.card.moneyInCard .addIncome { position: absolute; top: 6px; right: 6px; width: 30px; height: 30px; padding: 0; font-size: 20px; line-height: 1; border: none; border-radius: 8px; background: green; color: white; cursor: pointer; }
.listTitle { font-size: 14px; color: #555; text-align: center; margin: 2px 0 4px 0; }
ul { list-style: none; padding: 0; margin: 0; }
.entryList { margin-bottom: 8px; }
.entryList li { display: grid; grid-template-columns: 1fr auto auto auto; gap: 8px; align-items: center; background: white; padding: 6px 8px; margin-bottom: 4px; border-radius: 6px; font-size: 16px; }
.entryList li.withInv { grid-template-columns: 1fr auto auto auto auto; }
.entryList .entryText { min-width: 0; display: flex; flex-direction: column; line-height: 1.25; }
.entryList .entryText .note { overflow-wrap: anywhere; }
.entryList .entryDate { font-size: 12px; color: #888; }
.entryList strong { white-space: nowrap; direction: ltr; }
.entryList .inv { font-size: 12px; color: #666; display: flex; flex-direction: column; align-items: center; line-height: 1.1; }
.entryList .emptyRow { display: block; color: #666; font-size: 15px; text-align: center; }
button.del { padding: 3px 8px; border: none; border-radius: 6px; background: #999; color: white; cursor: pointer; }
button.edit { padding: 3px 8px; border: none; border-radius: 6px; background: #4a6cf7; color: white; cursor: pointer; }
.belowRow { display: flex; direction: ltr; justify-content: space-between; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
.afterJobBox { background: white; padding: 6px 8px; border-radius: 8px; margin-bottom: 0; text-align: center; width: calc(50% - 4px); }
.afterJobBox h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; }
.afterJobBox .total { font-size: 20px; font-weight: bold; }
.finishWrap { display: flex; align-items: center; }
.finishBtn { padding: 10px 22px; font-size: 16px; font-weight: bold; border: none; border-radius: 10px; background: #7a3db8; color: white; cursor: pointer; }
.finishBtn.reopen { background: #4a6cf7; }
.infoBox { background: white; border: 2px solid #4a6cf7; border-radius: 12px; padding: 8px; margin-bottom: 8px; display: grid; gap: 6px; }
.infoBox h2 { margin: 0; font-size: 15px; text-align: center; color: #4a6cf7; }
.infoGrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 6px; }
@media (max-width: 430px) { .infoGrid { grid-template-columns: 1fr; } }
.infoGrid label { display: flex; flex-direction: column; gap: 2px; font-size: 13px; color: #555; min-width: 0; }
.infoGrid input { width: 100%; min-width: 0; padding: 7px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
.infoGrid .wide { grid-column: 1 / -1; }

/* ===== Business page (the total summary) ===== */
#bizPage { display: none; }
#bizPage h1 { color: #2a6df4; }
#bizList { background: white; border: 2px solid #2a6df4; border-radius: 12px; padding: 8px; }
.perLine { display: grid; grid-template-columns: auto 1fr auto; gap: 8px; align-items: center; padding: 5px 4px; border-bottom: 1px solid #eee; font-size: 15px; }
.perLine .perDate { color: #888; font-size: 13px; }
.perLine .perNote { min-width: 0; overflow-wrap: anywhere; }
.perLine strong { direction: ltr; white-space: nowrap; }
.perTotal { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; background: #dfeaff; border-bottom: 2px solid #2a6df4; padding: 5px 4px; font-size: 14px; font-weight: bold; margin-bottom: 6px; }
.perTotal span { display: block; font-size: 12px; color: #555; font-weight: normal; }
.vatNote { font-size: 13px; color: #666; text-align: center; margin: -2px 0 8px; }
.blueColor { color: #2a6df4; }
.vatColor { color: #b38600; }

/* ===== Question boxes on the page itself ===== */
.overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 60; align-items: center; justify-content: center; padding: 16px; }
.overlay.show { display: flex; }
.nameDialog { background: white; border-radius: 16px; padding: 18px; width: 340px; max-width: 100%; max-height: 85vh; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 8px 30px rgba(0,0,0,0.3); }
.nameDialog h3 { margin: 0; font-size: 18px; text-align: center; }
.nameDialog p { white-space: pre-wrap; text-align: center; font-size: 16px; margin: 0; }
.nameDialog input { width: 100%; padding: 10px; font-size: 16px; border: 1px solid #bbb; border-radius: 8px; }
.nameRow { display: flex; gap: 8px; align-items: center; }
.nameRow input { flex: 1; min-width: 0; }
.nameMic { flex: 0 0 44px; width: 44px; height: 44px; border-radius: 22px; border: none; background: #4a6cf7; color: white; font-size: 20px; cursor: pointer; padding: 0; }
.nameMic.listening { background: #e0457b; }
.nameMicMsg { font-size: 14px; color: #333; }
.nameMicMsg:empty { display: none; }
.savedList { overflow-y: auto; max-height: 220px; display: flex; flex-direction: column; gap: 6px; }
.savedItem { display: flex; gap: 6px; }
.savedItem button.pick { flex: 1; padding: 9px; font-size: 16px; text-align: start; border: 1px solid #4a6cf7; border-radius: 8px; background: #f4f6ff; cursor: pointer; }
.savedItem button.forget { padding: 9px 12px; border: none; border-radius: 8px; background: #999; color: white; cursor: pointer; }
#pickList button { width: 100%; padding: 10px; font-size: 17px; border: 1px solid #4a6cf7; border-radius: 8px; background: #f4f6ff; cursor: pointer; text-align: center; }
#pickList button.pickStrong { background: #2a6df4; color: white; border-color: #2a6df4; font-weight: bold; }
.dialogButtons { display: flex; gap: 8px; justify-content: center; }
.dialogButtons button { padding: 9px 18px; font-size: 15px; border: none; border-radius: 8px; color: white; cursor: pointer; }
.dialogButtons .okBtn { background: green; }
.dialogButtons .cancelBtn { background: #666; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; padding: 4px 4px 4px 10px; border: 1px solid #4a6cf7; border-radius: 8px; background: #f4f6ff; font-size: 16px; }
[dir=ltr] .chip { padding: 4px 10px 4px 4px; }
.chip button { padding: 1px 7px; border: none; border-radius: 6px; background: #999; color: white; font-size: 13px; cursor: pointer; }
#storeMsg { position: fixed; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); left: 16px; right: 16px; text-align: center; font-size: 14px; color: white; background: crimson; border-radius: 8px; padding: 6px; z-index: 70; display: none; }

/* ===== Added for Melechet Sofer ===== */
.col.out { background: #fbebeb; border: 2px solid crimson; }
.goodsBox { background: white; border: 2px dashed green; border-radius: 8px; padding: 6px; margin-bottom: 8px; }
.goodsHead { position: relative; min-height: 30px; display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.goodsHead h3 { margin: 0; font-size: 14px; color: #555; font-weight: normal; text-align: center; padding: 0 36px; }
.goodsHead .goodsAdd { top: 0; }
.goodsBox .entryList li { background: #f4fbf3; }
.goodsQty { color: green; font-size: 17px; }
.afterJobBox.full { width: 100%; margin-bottom: 8px; }
.bothTag { font-size: 12px; color: #7a3db8; font-weight: bold; }
.roleRow { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; justify-content: center; font-size: 14px; color: #555; }
.emailRow { display: flex; gap: 6px; align-items: center; }
.emailRow input { flex: 1; min-width: 0; }
.enMic { flex: 0 0 auto; padding: 6px 8px; font-size: 13px; font-weight: bold; border: none; border-radius: 8px; background: #4a6cf7; color: white; cursor: pointer; white-space: nowrap; }
.enMic.listening { background: #e0457b; }
.heard .hint { flex-basis: 100%; font-size: 14px; color: #b45f06; }
#importOverlay .nameDialog { width: 400px; }

<script>
(function () {
'use strict';
// ================= Saved on this device =================
const KEY = 'melechet-sofer-v2', OLD_KEY = 'melechet-sofer-v1';
const DEFAULT_ITEMS = ['ציצית', 'טלית', 'תפילין', 'מזוזה', 'ספר תורה', 'בתים', 'רצועות', 'קלף'];
const DEFAULT_TYPES = ['שכירות', 'חשמל', 'מים', 'ארנונה', 'גז', 'טלפון', 'אינטרנט', 'דלק', 'ביטוח', 'רואה חשבון', 'ציוד משרדי', 'דואר ומשלוחים', 'פרסום', 'משכורת', 'עמלות בנק'];
let storageOK = true;
let S = null;
function lsGet(k) { try { return localStorage.getItem(k); } catch (e) { storageOK = false; return null; } }
function dayKey(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
// kinds: income (money from a customer), job (materials for a customer's job), goods (items a customer gave me, not money),
//        buy (bought from a supplier), pay (money I paid a supplier)
function newEntry(kind, amount, item, note, day, qty) {
  const d = day ? new Date(day + 'T12:00:00') : new Date();
  const e = { id: uid(), kind: kind, amount: amount, item: item || '', note: note || '', date: d.toLocaleDateString(), day: dayKey(d), invoice: kind === 'job' || kind === 'buy' };
  if (kind === 'goods') { e.qty = qty || 1; delete e.amount; e.invoice = false; }
  return e;
}
function newBox(role, name) {
  const d = new Date();
  return { id: 'b' + uid(), isCustomer: role !== 'supplier', isSupplier: role === 'supplier', name: name || '', entries: [], pct: S ? S.lastPct : 18,
    created: d.toLocaleDateString(), createdDay: dayKey(d), address: '', phone: '', email: '', price: 0 };
}
// Older cards had one kind; now a card can be a customer, a supplier, or both.
function normalizeBox(b) {
  if (b.isCustomer === undefined && b.isSupplier === undefined) {
    b.isCustomer = b.kind !== 'supplier';
    b.isSupplier = b.kind === 'supplier';
    if (b.isSupplier) (b.entries || []).forEach(e => { if (e.kind === 'job') e.kind = 'buy'; });
  }
  delete b.kind;
  if (!Array.isArray(b.entries)) b.entries = [];
  // Older cards had "paid / still owes" buttons and a typed amount still owed. Now there is a full price (quote)
  // and what is still owed is worked out: full price - money in.
  if (b.price === undefined) {
    const inc = b.entries.reduce((s, e) => s + (e.kind === 'income' ? num(e.amount) : 0), 0);
    b.price = b.paid ? inc : num(b.owesMe) > 0 ? inc + num(b.owesMe) : 0;
  }
  delete b.paid; delete b.owesMe;
  return b;
}
function seed() {
  S = { lang: 'he', items: DEFAULT_ITEMS.slice(), names: [], lastPct: 18, boxes: [] };
  const c = newBox('customer', 'משה לוי (דוגמה)');
  Object.assign(c, { address: 'רחוב רבי עקיבא 40, בני ברק', phone: '050-1234567', price: 5000 });
  c.entries.push(newEntry('income', 3200, 'תפילין', 'תפילין משה לוי 3200'), newEntry('job', 450, 'בתים', 'בתים 450'), newEntry('goods', null, 'מזוזה', 'קיבלתי ממשה שש מזוזות', null, 6));
  const s = newBox('supplier', 'בית הקלף (דוגמה)');
  Object.assign(s, { address: 'רחוב יפו 97, ירושלים', phone: '02-6234567' });
  s.entries.push(newEntry('buy', 1200, 'קלף', 'קלף 1200'), newEntry('pay', 500, '', 'שילמתי 500'));
  S.boxes.push(c, s);
  return S;
}
function migrateV1(old) {
  S = { lang: 'he', items: Array.isArray(old.items) ? old.items : DEFAULT_ITEMS.slice(), names: [], lastPct: num(old.vat) || 18, boxes: [] };
  (old.customers || []).forEach(c => {
    const b = newBox('customer', c.name); Object.assign(b, { address: c.address || '', phone: c.phone || '', email: c.email || '' });
    (c.entries || []).forEach(e => b.entries.push(newEntry('income', num(e.amount), e.item, e.item, e.date)));
    if (c.paid) b.price = (c.entries || []).reduce((s, e) => s + num(e.amount), 0);
    if (num(c.materials) > 0) b.entries.push(newEntry('job', num(c.materials), 'חומרים', 'חומרים'));
    S.boxes.push(b);
  });
  (old.suppliers || []).forEach(s => {

function ask(message, withInput, def) {

// ----- Changing a row by voice (the mic on each row) -----
// "כמות 3" = quantity, "פריט קלף" = item, "סכום 1200" = amount; more than one in the same sentence.
const MIC_SVG = '<svg class="micSvg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3M8 21h8"/></svg>';
const EDIT_WORDS = [
  { f: 'qty', re: /^(ה?כמות|qty|quantity)$/ },
  { f: 'item', re: /^(ה?פריט|ה?מוצר|item)$/ },
  { f: 'type', re: /^(ה?סוג|type)$/ },
  { f: 'amount', re: /^(ה?סכום|ה?מחיר|amount|price)$/ }
];
function parseEdit(text) {
  const out = {}, free = [];
  let cur = null, buf = [];
  const flush = () => { if (cur) out[cur] = buf.join(' ').trim(); else free.push(...buf); buf = []; };
  normalize(text).trim().split(' ').filter(Boolean).forEach(w => {
    const k = EDIT_WORDS.find(x => x.re.test(w) || (w.length > 2 && w[0] === 'ו' && x.re.test(w.slice(1))));
    if (k) { flush(); cur = k.f; } else buf.push(w);
  });
  flush();
  return { said: out, free: free.filter(w => !FILLER.has(w) && !/^(תשנה|שנה|תתקן|תקן|ל|change|set)$/.test(w)).join(' ') };
}
// a number said as "לשלוש" / "ל-3"
function numberIn(v) { return findAmount(String(v).split(' ').map(w => w.length > 1 && w[0] === 'ל' && isQtyWord(w.slice(1)) ? w.slice(1) : w).join(' ')); }
// allowed: the fields this row has. own = a business expense row (its item is its type).
function rowVoiceEdit(e, allowed, own, boxId) {
  return text => {
    const t = T(), p = parseEdit(text), said = p.said, old = {}, changes = [];
    if (!Object.keys(said).length && p.free) { // no field word: a number is the amount (quantity on items), words are the item
      if (numberIn(p.free) !== null && !/[א-תa-z]{2,}/.test(p.free.replace(/\S*\d\S*/g, ''))) said[allowed.includes('amount') ? 'amount' : 'qty'] = p.free;
      else said.item = p.free;
    }
    if (own && said.item !== undefined && said.type === undefined) said.type = said.item;
    if (!own && said.type !== undefined && said.item === undefined) said.item = said.type;
    allowed.forEach(f => {
      if (said[f] === undefined || said[f] === '') return;
      let v;
      if (f === 'qty' || f === 'amount') { v = numberIn(said[f]); if (v === null) return; }
      else {
        const toks = said[f].split(' ').filter(w => !FILLER.has(w));
        const m = takeItemAt(toks.slice(), [], f === 'type' ? S.expenseTypes : undefined);
        v = m ? m.name : toks.join(' ').trim(); if (!v) return;
      }
      old[f] = e[f]; e[f] = v;
      changes.push(t.editNames[f] + ' ' + (f === 'amount' ? f2(v) : v));
    });
    if (!changes.length) { showMsg(t.heardWord + ' "' + text + '". ' + t.editHow); return; }
    save(); renderAll();
    showMsg(t.changed + changes.join(', '), { restore: { id: e.id, own: !!own, boxId: boxId, old: old } });
  };
}

}

// ================= Understanding Hebrew: item, name, amount =================
const UNITS = { 'אפס': 0, 'אחד': 1, 'אחת': 1, 'שתיים': 2, 'שתים': 2, 'שניים': 2, 'שנים': 2, 'שני': 2, 'שתי': 2, 'שלוש': 3, 'שלושה': 3, 'שלושת': 3, 'שלש': 3,
  'ארבע': 4, 'ארבעה': 4, 'ארבעת': 4, 'חמש': 5, 'חמישה': 5, 'חמשת': 5, 'שש': 6, 'שישה': 6, 'ששת': 6, 'שבע': 7, 'שבעה': 7, 'שבעת': 7,
  'שמונה': 8, 'שמונת': 8, 'תשע': 9, 'תשעה': 9, 'תשעת': 9, 'עשר': 10, 'עשרה': 10, 'עשרת': 10,
  'עשרים': 20, 'שלושים': 30, 'ארבעים': 40, 'חמישים': 50, 'שישים': 60, 'שבעים': 70, 'שמונים': 80, 'תשעים': 90,
  'מאה': 100, 'מאתיים': 200, 'אלפיים': 2000,
  one: 1, two: 2, three: 3, four: 4, five: 5, six: 6, seven: 7, eight: 8, nine: 9, ten: 10, twenty: 20, thirty: 30, forty: 40, fifty: 50, sixty: 60, seventy: 70, eighty: 80, ninety: 90 };
const HUNDREDS = ['מאות', 'hundred'], THOUSANDS = ['אלף', 'אלפים', 'thousand'];
const FILLER = new Set(['שקל', 'שקלים', 'ש"ח', 'שח', '₪', 'ב', 'של', 'עבור', 'על', 'את', 'מ', 'ל', 'ו', 'לי', 'ממנו', 'ממנה', 'מאת', 'קיבלתי', 'קבלתי', 'שילמתי', 'שלמתי', 'שילמנו', 'שלמנו', 'העברתי', 'העברנו', 'תשלום', 'לספק', 'לו', 'לה', 'נכנס', 'נכנסו', 'נכנסה', 'נכנסים', 'שנכנס', 'שנכנסו', 'הכנסתי', 'כסף', 'נתתי', 'הוצאתי', 'הוצאנו', 'הביאו', 'הביא', 'הביאה', 'קניתי', 'מכרתי', 'הכנסה', 'הכנסות', 'הוצאה', 'הוצאות', 'סכום', 'בסך', 'סך', 'הכל', 'הכול', 'בערך', 'and', 'for', 'to', 'from', 'shekel', 'shekels']);
function numWord(w) {
  if (w in UNITS || HUNDREDS.includes(w) || THOUSANDS.includes(w)) return w;
  if (w.length > 1 && w[0] === 'ו') { const r = w.slice(1); if (r in UNITS || HUNDREDS.includes(r) || THOUSANDS.includes(r)) return r; }
  return null;
}
function normalize(s) {
  return ' ' + String(s || '').replace(/₪/g, ' ').replace(/(^|\s)([בלומשה])\s*-\s*(?=\d)/g, '$1$2 ') // "ב-200" = "ב 200".replace(/[٠-٩]/g, d => String(d.charCodeAt(0) - 0x0660)).replace(/[״“”]/g, '"').replace(/[׳‘’]/g, "'")
    .replace(/(\d),(?=\d{3})/g, '$1').replace(/[.,;:!?()\-־–—]+(?!\d)/g, ' ').replace(/\s+/g, ' ').toLowerCase() + ' ';
}
// The amount, digits first, then number words ("שלושת אלפים ומאתיים" = 3200).
function takeAmount(toks) {
  for (let i = 0; i < toks.length; i++) {
    const m = toks[i].match(/^(\d+(?:\.\d+)?)$/);
    if (m) {
      let v = parseFloat(m[1]), n = 1;
      if (toks[i + 1] && THOUSANDS.includes(toks[i + 1])) { v *= 1000; n = 2; }
      toks.splice(i, n); return v;

// נתתי / הוצאתי -> spending (הוצאות); שילמתי -> a payment; נכנס -> money in. Then the items or the amount are read.
const OUT_RE = /(^|\s)ו?(נתתי|נתנו|הוצאתי|הוצאנו)(?=\s|$)/;
function verbOf(sentence) {
  const s = normalize(sentence), found = [];
  const at = (re, kind, rank) => { const m = re.exec(s); if (m) found.push({ kind: kind, i: m.index + (m[1] || '').length, rank: rank }); };
  at(GOODS_RE, 'goods', 0); at(INCOME_RE, 'income', 1); at(PAY_RE, 'pay', 2); at(OUT_RE, 'out', 3); // "נתנו לי" = items, not spending
  let pos = 0;
  for (const w of s.split(' ')) { if (w && (isWorkVerb(w) || isWorkNoun(w))) { found.push({ kind: 'work', i: pos, rank: 4 }); break; } pos += w.length + 1; }
  found.sort((a, b) => a.i - b.i || a.rank - b.rank);

}
// ----- "העבודה שבוצעה": describing the work, by voice -----
// A sentence with a work verb ("שייפתי", "סידרתי", "החלפתי", "תיקנתי", "בדקתי", "כתבתי", "שייפנו"...) describes the job.

const NOT_WORK = new Set(['נכנסתי', 'קיבלתי', 'קבלתי', 'שילמתי', 'שלמתי', 'העברתי', 'קניתי', 'מכרתי', 'הכנסתי', 'הוצאתי', 'לקחתי', 'החזרתי', 'נתתי', 'אמרתי', 'חשבתי', 'רציתי',
  'קיבלנו', 'קבלנו', 'שילמנו', 'שלמנו', 'העברנו', 'קנינו', 'מכרנו', 'הוצאנו', 'לקחנו', 'החזרנו', 'נתנו', 'אמרנו',
  'שבתי', 'אמיתי', 'ביתי', 'בריתי', 'עכשיו', 'אנחנו', 'שלנו', 'אותנו', 'איתנו', 'אתנו', 'עלינו', 'אצלנו', 'אלינו', 'בשבילנו', 'לפנינו', 'ממנו']);

// Each with its forms: the noun, "of" (צביעת), plural (תיקונים / בדיקות). Money nouns (הוצאה, הכנסה, הנחה, העברה, מכירה) are not here.
const WORK_NOUNS = new Set(('שיוף שיופים שיופי שייוף סידור סידורים סידורי החלפה החלפת החלפות צביעה צביעת צביעות '
  + 'תיקון תיקונים תיקוני בדיקה בדיקת בדיקות כתיבה כתיבת תפירה תפירת הדבקה הדבקת השחרה השחרת השחרות '
  + 'ניקוי ניקויים ניקיון יישור ישור ריבוע ריבועים גיהוץ הגהה הגהת הגהות קשירה קשירת הכנה הכנת '
  + 'הרכבה הרכבת פירוק חידוש חידושים חידושי ליטוש מריחה מריחת הברקה הברקת גלגול שרטוט שירטוט '
  + 'עיבוד חיתוך גזירה גזירת שיפוץ שיפוצים חיזוק ייבוש הידוק טיפול טיפולים כיסוי ציפוי ציפויים '
  + 'הלבנה הלבנת השחזה השחזת סימון שיפור שיפורים מתיחה מתיחת יציקה יציקת').split(' '));

// The card mic and the red arrow: a field word fills that field; "קיבלתי ... 6 מזוזות" adds items;
// otherwise an amount: job spending (a purchase on a supplier card; "שילמתי" = paid, "קיבלתי" = money in).
function handleCard(sentence) {
  const t = T(), b = getBox(currentId);
  sentence = String(sentence || '').trim();
  if (!b || !sentence) return;
  // "הצעת מחיר 8000" = this card's full price, not job spending
  if (QUOTE_RE.test(sentence)) { pendingField = null; setQuote(sentence, b); return; }
  const verb = verbOf(sentence);
  // a work verb: the sentence is the work done, even with item names in it ("שייפתי את הבתים של התפילין")
  if (verb === 'work' && b.isCustomer) { pendingField = null; addWork(b, sentence); return; }
  const fls = fieldsOf(sentence);
  if (fls.length > 1) { fillFields(b, fls); return; }
  const fl = fieldOf(sentence);
  if (fl) {
    if (fl.value) { pendingField = null; fillField(b, fl.f, fl.value); }
    else { pendingField = fl.f; setHeard(t.sayField(t.fieldNames[fl.f])); }
    return;
  }
  if (pendingField) { const f = pendingField; pendingField = null; fillField(b, f, sentence); return; }
  // items: after "קיבלתי", or items said with no verb on a customer card ("תפילין ושלוש מזוזות")
  if (verb === 'goods' || (verb === null && b.isCustomer)) {
    const g = itemsOnly(sentence) || (verb === 'goods' ? goodsList(sentence, true) : null);
    if (g) { addGoods(b, g, sentence, false); return; }
  }
  const a = analyzeQty(sentence);
  if (a.amount === null) { setHeard(t.heardWord + ' "' + sentence + '" ' + t.noAmount); return; } // an item without an amount is never money
  let kind;
  if (verb === 'income' || verb === 'goods') kind = 'income'; // "נכנס 1000", "קיבלתי 500": money in (a supplier card becomes a customer too)
  else if (verb === 'pay') kind = b.isSupplier ? 'pay' : 'job';
  else if (verb === 'out') kind = b.isCustomer ? 'job' : 'buy'; // "נתתי" = spending
  else if (b.isCustomer && /מכרתי|received/.test(sentence)) kind = 'income';
  else if (b.isSupplier && (!b.isCustomer || /קניתי|קנייה|קניה|bought/.test(sentence))) kind = 'buy';
  else kind = 'job';
  addTo(b, kind, a.amount, a.item || a.rest, sentence, false, kind === 'buy' ? a.qty : undefined);
}

  const a = analyzeQty(answer, true); // typed into a money box: a number is the amount

// Inside the Android app the page talks to the phone through native plugins. In a browser none of this runs.
const NATIVE = !!(window.Capacitor && typeof window.Capacitor.isNativePlatform === 'function' && window.Capacitor.isNativePlatform());
const nativePlugin = name => { try { return NATIVE && window.Capacitor.registerPlugin ? window.Capacitor.registerPlugin(name) : null; } catch (e) { return null; } };

// The phone's own speech recognition. It returns the words when you pause, and can start again by itself:
// after "מייל" it beeps and listens again in English; after "טלפון" alone it listens again for the number.
async function nativeVoice(btn, msgEl, onText, opts) {
  const t = T(), front = msgEl === $('startMsg');
  const say = s => { if (front) showMsg(s); else msgEl.textContent = s; };
  try {
    let perm = await NativeSpeech.checkPermissions();
    if (perm.speechRecognition !== 'granted') perm = await NativeSpeech.requestPermissions();
    if (perm.speechRecognition !== 'granted') { say(t.micBlocked); return; }
  } catch (e) { say(t.micBlocked); return; }
  try { const av = await NativeSpeech.available(); if (!av.available) { say(t.noVoiceApp); return; } } catch (e) {}
  let stopped = false;
  const listenOnce = async lang => {
    listening = { stop: () => { stopped = true; NativeSpeech.stop().catch(() => {}); } };
    btn.classList.add('listening');
    try {
      const r = await NativeSpeech.start({ language: lang, maxResults: 1, partialResults: false, popup: false });
      return (r && r.matches && r.matches[0]) || '';
    } catch (e) { return ''; } finally { btn.classList.remove('listening'); listening = null; }
  };
  say(t.listening);
  let text = await listenOnce(opts.lang || 'he-IL');
  if (!text) { say(stopped ? '' : t.cantHear); return; }
  if (opts.emailSwitch && saysEmail(text) && !fieldOf(text).value) {
    beep(); say(t.emailListening);
    const en = await listenOnce('en-US');
    if (en) text = 'email ' + en;
  } else if (opts.holdIf && opts.holdIf(text)) {
    say(t.listening);
    const more = await listenOnce(opts.lang || 'he-IL');
    if (more) text += ' ' + more;
  }
  onText(text.trim());
}
// Save a file into the app and open the phone's share menu (WhatsApp, email, Drive...).
function toBase64(bytes) { let s = ''; const chunk = 0x8000; for (let i = 0; i < bytes.length; i += chunk) s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk)); return btoa(s); }
async function nativeSaveAndShare(name, data, title) {
  const bytes = data instanceof Blob ? new Uint8Array(await data.arrayBuffer()) : new TextEncoder().encode(String(data));
  const w = await NativeFiles.writeFile({ path: name, data: toBase64(bytes), directory: 'CACHE' });
  try { await NativeShare.share({ title: title || name, dialogTitle: title || name, files: [w.uri] }); }
  catch (e) { if (!/cancel/i.test(String(e && (e.message || e)))) throw e; return 'cancelled'; }
  return 'shared';
}

function colLetter(i) { let s = ''; i++; while (i > 0) { const m = (i - 1) % 26; s = String.fromCharCode(65 + m) + s; i = Math.floor((i - 1) / 26); } return s; }
function importRows() {
  const ws = imp.wb.Sheets[imp.sheet];
  const rows = window.XLSX.utils.sheet_to_json(ws, { header: 1, raw: false, defval: '' });
  return rows.filter(r => Array.isArray(r) && r.some(c => String(c == null ? '' : c).trim() !== ''));
}
function importColumns(rows) {
  const n = rows.reduce((m, r) => Math.max(m, r.length), 0), t = T();
  const head = imp.header ? rows[0] || [] : [];
  const sample = (imp.header ? rows[1] : rows[0]) || [];
  return Array.from({ length: n }, (_, i) => {
    const h = String(head[i] == null ? '' : head[i]).trim();
    const sm = String(sample[i] == null ? '' : sample[i]).trim();
    return { i: i, header: h, label: (h || t.importColumn(colLetter(i))) + (sm && sm !== h ? ' (' + sm.slice(0, 24) + ')' : '') };
  });
}
function guessMapping(cols) {
  const m = {}; IMPORT_FIELDS.forEach(f => { m[f] = -1; });
  if (!imp.header) return m;
  const used = new Set();
  IMPORT_GUESS.forEach(([f, re]) => {
    const c = cols.find(c => !used.has(c.i) && re.test(c.header.toLowerCase().replace(/[״“”]/g, '"').replace(/\s+/g, ' ').trim()));
    if (c) { m[f] = c.i; used.add(c.i); }
  });
  if (m.name < 0) { const c = cols.find(c => !used.has(c.i)); if (c) m.name = c.i; }
  return m;
}
function drawImport(keepMapping) {
  const t = T(), rows = importRows(), cols = importColumns(rows);
  $('importInfo').textContent = t.importInfo(imp.file, Math.max(rows.length - (imp.header ? 1 : 0), 0));
  $('importSheetRow').style.display = imp.wb.SheetNames.length > 1 ? '' : 'none';
  $('importSheet').innerHTML = imp.wb.SheetNames.map(n => '<option' + (n === imp.sheet ? ' selected' : '') + '>' + esc(n) + '</option>').join('');
  if (!keepMapping) imp.map = guessMapping(cols);
  const box = $('importFields'); box.innerHTML = '';
  IMPORT_FIELDS.forEach(f => {
    const lab = document.createElement('label'); lab.htmlFor = 'imp-' + f; lab.textContent = t.importFields[f];
    const sel = document.createElement('select'); sel.id = 'imp-' + f;
    sel.innerHTML = '<option value="-1">' + esc(t.importNone) + '</option>' + cols.map(c => '<option value="' + c.i + '"' + (imp.map[f] === c.i ? ' selected' : '') + '>' + esc(c.label) + '</option>').join('');
    sel.onchange = () => { imp.map[f] = +sel.value; importPreview(); };
    box.append(lab, sel);
  });
  $('importRole').innerHTML = '<option value="customer">' + esc(t.importAsCust) + '</option><option value="supplier"' + (imp.role === 'supplier' ? ' selected' : '') + '>' + esc(t.importAsSupp) + '</option>';
  importPreview();
}
function fixPhone(v) {
  v = String(v || '').trim(); if (!v) return '';
  let d = v.replace(/[^\d+]/g, '');
  if (/^\+?972/.test(d)) d = '0' + d.replace(/^\+?972/, '');
  if (/^5\d{8}$/.test(d) || /^[2-9]\d{7}$/.test(d)) d = '0' + d; // Excel drops the leading 0
  if (/^05\d{8}$/.test(d)) return d.slice(0, 3) + '-' + d.slice(3);
  if (/^0[2-9]\d{7}$/.test(d)) return d.slice(0, 2) + '-' + d.slice(2);
  return v;
}
function roleFromCell(v, fallback) {
  v = String(v || '').toLowerCase();
  if (/(לקוח.*ספק|ספק.*לקוח|שניהם|both)/.test(v)) return 'both';
  if (/(ספק|supplier|vendor)/.test(v)) return 'supplier';
  if (/(לקוח|customer|client)/.test(v)) return 'customer';
  return fallback;
}
function nameKey(n) { return String(n || '').toLowerCase().replace(/\s*\((דוגמה|example)\)\s*/g, ' ').replace(/\s+/g, ' ').trim(); }
function buildImport() {
  const rows = importRows(), m = imp.map, data = imp.header ? rows.slice(1) : rows;
  const have = new Set(S.boxes.map(b => nameKey(b.name)).filter(Boolean)), seen = new Set();
  const out = []; let skipped = 0, noName = 0;
  const val = (r, i) => i >= 0 ? String(r[i] == null ? '' : r[i]).trim() : '';
  data.forEach(r => {
    let name = val(r, m.name); const last = val(r, m.lastName);
    if (last && last !== name) name = (name + ' ' + last).trim();
    name = name.replace(/\s+/g, ' ');
    if (!name) { noName++; return; }
    const key = nameKey(name);
    if (have.has(key) || seen.has(key)) { skipped++; return; }
    seen.add(key);
    out.push({ name: name, phone: fixPhone(val(r, m.phone)), email: val(r, m.email).toLowerCase().replace(/\s+/g, ''), address: val(r, m.address), role: roleFromCell(val(r, m.role), imp.role) });
  });
  return { out: out, skipped: skipped, noName: noName };
}
function importPreview() {
  const t = T(), el = $('importPreview');
  if (imp.map.name < 0) { el.textContent = t.importNoName; el.className = 'importPreview bad'; $('importGo').disabled = true; return; }
  const r = buildImport();
  el.textContent = r.out.length ? t.importPreview(r.out.length, r.skipped, r.noName) : t.importNothing + (r.skipped ? '\n' + t.importPreview(0, r.skipped, 0).split('\n')[1] : '');
  el.className = 'importPreview' + (r.out.length ? '' : ' bad');
  $('importGo').disabled = !r.out.length;
}
$('importBtn').onclick = () => $('importFile').click();
$('importFile').onchange = async ev => {
  const t = T(), file = ev.target.files && ev.target.files[0];
  ev.target.value = '';
  if (!file) return;
  $('fileMsg').textContent = t.importLoading;
  let XLSX;
  try { XLSX = await loadXLSX(); } catch (e) { $('fileMsg').textContent = t.excelFail; return; }
  let wb;
  try {
    const buf = await file.arrayBuffer();
    if (/\.(csv|txt)$/i.test(file.name) || /csv|text\/plain/.test(file.type)) {
      // Hebrew CSV files are often saved in Windows Hebrew instead of UTF-8.
      let text = new TextDecoder('utf-8').decode(buf);
      if (text.includes('\uFFFD')) { try { text = new TextDecoder('windows-1255').decode(buf); } catch (e) {} }
      wb = XLSX.read(text.replace(/^\uFEFF/, ''), { type: 'string' });
    } else wb = XLSX.read(buf, { type: 'array' });
  } catch (e) { $('fileMsg').textContent = t.importBad; return; }
  if (!wb || !wb.SheetNames || !wb.SheetNames.length) { $('fileMsg').textContent = t.importBad; return; }
  $('fileMsg').textContent = '';
  imp = { wb: wb, file: file.name, sheet: wb.SheetNames[0], header: true, role: 'customer', map: {} };
  $('importHeader').checked = true;
  drawImport(false);
  $('importOverlay').classList.add('show');
};
$('importSheet').onchange = () => { imp.sheet = $('importSheet').value; drawImport(false); };
$('importHeader').onchange = () => { imp.header = $('importHeader').checked; drawImport(false); };
$('importRole').onchange = () => { imp.role = $('importRole').value; importPreview(); };
$('importCancel').onclick = () => { $('importOverlay').classList.remove('show'); imp = null; };
$('importGo').onclick = () => {
  const t = T(), r = buildImport();
  if (!r.out.length) return;
  const ids = [];
  r.out.forEach(x => {
    const b = newBox(x.role === 'supplier' ? 'supplier' : 'customer', x.name);
    if (x.role === 'both') { b.isCustomer = true; b.isSupplier = true; }
    b.phone = x.phone; b.email = x.email; b.address = x.address;
    S.boxes.push(b); ids.push(b.id); rememberName(x.name);
  });
  save(); renderAll();
  $('importOverlay').classList.remove('show'); imp = null;
  const msg = $('fileMsg');
  msg.innerHTML = ''; msg.append(document.createTextNode(t.importDone(r.out.length, r.skipped) + ' '));
  const u = document.createElement('button'); u.type = 'button'; u.className = 'undoBtn'; u.textContent = t.undo;
  u.onclick = () => { S.boxes = S.boxes.filter(b => !ids.includes(b.id)); save(); renderAll(); msg.textContent = T().importUndone; };
  msg.appendChild(u);
};

// ================= Business name and logo (both optional) =================
function drawBiz() {
  const n = $('startBizName'), l = $('startLogo'), name = String(S.bizName || '').trim();
  n.textContent = name; n.hidden = !name;
  if (S.logo) { l.src = S.logo; l.hidden = false; } else { l.removeAttribute('src'); l.hidden = true; }
}
let bizDraft = '';
function drawLogoPreview() {
  const t = T(), pv = $('bizLogoPreview');
  if (bizDraft) { pv.src = bizDraft; pv.hidden = false; } else { pv.removeAttribute('src'); pv.hidden = true; }
  $('bizLogoBtn').textContent = bizDraft ? t.bizLogoChange : t.bizLogoPick;
  $('bizLogoDel').hidden = !bizDraft;
}
function openBizDialog(first) {
  const t = T();
  bizDraft = S.logo || '';
  $('bizDlgTitle').textContent = first ? t.welcomeTitle : t.bizSetTitle;
  $('bizText').textContent = t.bizText;
  $('bizNameLbl').textContent = t.bizNameLbl;
  $('bizNameInput').value = S.bizName || ''; $('bizNameInput').placeholder = t.bizNameHint;
  $('bizLogoDel').textContent = t.bizLogoDel;
  $('bizOk').textContent = t.saveBtn; $('bizCancel').textContent = first ? t.skipBtn : t.cancelBtn;
  $('bizMsg2').textContent = '';
  drawLogoPreview();
  $('bizOverlay').classList.add('show');
}
function closeBizDialog(keep) {
  if (keep) { S.bizName = $('bizNameInput').value.trim(); S.logo = bizDraft || ''; }
  S.welcomed = true; save(); drawBiz();
  $('bizOverlay').classList.remove('show');
}
// The picture is made small (at most 400 pixels) so it fits in the app's storage and the backup file.
function shrinkImage(file, max) {
  return new Promise((resolve, reject) => {
    const rd = new FileReader();
    rd.onerror = reject;
    rd.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.naturalWidth || img.width, img.naturalHeight || img.height));
        const c = document.createElement('canvas');
        c.width = Math.max(1, Math.round((img.naturalWidth || img.width) * k)); c.height = Math.max(1, Math.round((img.naturalHeight || img.height) * k));
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        const photo = /jpe?g/i.test(file.type); // photos as JPEG (small); other pictures as PNG (keeps a see-through background)
        resolve(c.toDataURL(photo ? 'image/jpeg' : 'image/png', 0.88));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(file);
  });
}
$('bizLogoBtn').onclick = () => $('bizLogoFile').click();
$('bizLogoDel').onclick = () => { bizDraft = ''; drawLogoPreview(); };
$('bizLogoFile').onchange = async e => {
  const f = e.target.files && e.target.files[0]; e.target.value = '';
  if (!f) return;
  try { bizDraft = await shrinkImage(f, 400); $('bizMsg2').textContent = ''; drawLogoPreview(); }
  catch (err) { $('bizMsg2').textContent = T().bizLogoBad; }
};
$('bizOk').onclick = () => closeBizDialog(true);
$('bizCancel').onclick = () => closeBizDialog(false);
$('bizSetBtn').onclick = () => openBizDialog(false);

S = load();
S.lang = 'he'; // the app is Hebrew only
if (!Array.isArray(S.own)) S.own = [];
if (!Array.isArray(S.expenseTypes)) S.expenseTypes = DEFAULT_TYPES.slice();
if (S.ownPct === undefined) S.ownPct = 18;
save();
applyLang();
showPage('start');
$('startMsg').textContent = T().startHint;
drawBiz();
if (!S.welcomed) openBizDialog(true); // the first time: the welcome window (can be skipped)
// ----- Start page top bar: date (regular and Hebrew) and a clock that keeps itself up to date -----
function drawTopBar() {
  const now = new Date(), g = document.getElementById('tbGreg'); if (!g) return;
  g.textContent = gregText(now);
  document.getElementById('tbHeb').textContent = hebDate(now);
  document.getElementById('tbClock').textContent = String(now.getHours()).padStart(2, '0') + ':' + String(now.getMinutes()).padStart(2, '0');
}
drawTopBar();
setTimeout(() => { drawTopBar(); setInterval(drawTopBar, 60000); }, 60000 - Date.now() % 60000 + 50); // on the minute
document.addEventListener('visibilitychange', () => { if (!document.hidden) drawTopBar(); }); // back from the background
})();
